name: Publish website

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      docs-repository:
        required: true
        type: string
      docs-ref:
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          repository: KamePowerWorld/kpw-web
          path: web
      - name: Check out documentation
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.docs-repository || 'KamePowerWorld/kpw-docs' }}
          ref: ${{ inputs.docs-ref || 'master' }}
          path: docs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
        env:
          KPW_DOCS_DIR: ${{ github.workspace }}/docs
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run test:e2e -- --project=chromium
        working-directory: web
        env:
          KPW_DOCS_DIR: ${{ github.workspace }}/docs
      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy --config dist/server/wrangler.json
        working-directory: web
      - name: Report pending Cloudflare setup
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "Build passed; deployment is waiting for Cloudflare repository secrets."
